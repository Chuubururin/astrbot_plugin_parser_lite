name: release

# 发布信任链（SLSA 对标）：
# v* tag（promote 尾部自动派发）→ tag ∈ main 推进线校验 → 确定性测试 →
# 构建 zip（显式白名单）→ Syft 生成 SPDX SBOM → actions/attest 生成
# SLSA provenance 与 SBOM 证明（id-token 短期 Sigstore 证书）→
# 证明 bundle 落成 release 附件（离线可验）→ gh release。
# 发布流程不恢复任何缓存（cache-poisoning 审计项）。
# tag 规范：v{metadata.yaml 的 version}，直接沿用上游 nonebot-plugin-parser-lite
# 版本号；版本由 sync 随上游 roll 自动跟随，本 workflow 校验 tag 与之锁步。
#
# ── 发布轨没有人工放行（维护契约）──────────────────────────────────────
# 人不批准 roll 的内容，只修「管道红」。安全闸的位置因此全部前移/机器化：
#   · sync-upstream 的供应链判据「异常即红」（scripts/upstream_sync.py）；
#   · 本文件的「tag 必在 main 历史线」校验——dev 上未经 promote 的旁路 tag 出不了 Release；
#   · PR 轨道的三道 required checks。
# 旧仓库链上曾声明 `environment: release` 人工放行：在 private+Free 时代是
# 想象中的门，在单人全自动契约下是停摆点（超时含审批等待、self-review 开关
# 可致永久死锁），已随契约一并拆除。钉扎见 tests/test_supply_chain.py。
#
# ⚠️ 服务端配置无自动巡检（如实声明的已知缺口，缓解见 doc/BRANCHING.md §9）。
# 以下靠人工纪律维护，改动 Settings 后重放 scripts/apply_branch_protection.sh
# （可回读校核）：
#   · `dev` 的 required_status_checks（须与 ci.yml 的 job name 逐字一致）
#   · `main` **不得**启用 required_pull_request_reviews 与
#     required_status_checks（否则指针式快进合并被永久锁死）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          发版 tag（promote 自动派发时传入；GITHUB_TOKEN 的 tag push
          不触发工作流，dispatch 才是可信的续链）。留空 = 由 push tag 触发。
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # 按 tag 名归组：tag push 与 promote 的显式 dispatch 双通道指向同一 tag 时
  # 串行执行，配合「Release 已存在则跳过」消化重复。workflow 级没有 inputs
  # 上下文（那是可复用工作流的），必须走 github.event。
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: build + attest + publish release
    runs-on: ubuntu-latest
    # 纯构建时长 + 余量：发布轨无人工环节，超时不再需要覆盖审批等待。
    timeout-minutes: 20
    permissions:
      contents: write # 创建 Release
      id-token: write # SLSA provenance（Sigstore 短期证书签名）
      attestations: write # 写入 GitHub attestation store（gh attestation verify 可验）
    env:
      GH_TOKEN: ${{ github.token }}
      # 双触发通道下的统一 tag 名：push 时 = ref_name，dispatch 时 = 输入。
      # 发布物文件名一律以它为准（原样用 tag 名，不重复补 v）。
      TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: tag 与 metadata 版本锁步校验 + tag 必在 main 历史线
        run: |
          set -euo pipefail
          case "${TAG_NAME}" in
            */*) echo "::error::tag 名含 '/'（${TAG_NAME}）会破坏发布物文件路径，请使用无斜杠 tag"; exit 1 ;;
          esac
          # 「发布 tag 只能来自 promote 推进线」的机器判定。判据是 **tag 的
          # 提交 ∈ main 历史**（祖先），而非「= main 尖端」：尖端相等会误锁
          # 「版本未变的修复提交把 main 前移后补发上一版本」的合法补救
          # （2026-09-25 实弹抓到的停摆）。dev 上未经 promote 的旁路 tag
          # 不在 main 祖先内，照样判红。compare API 判祖先——checkout 是
          # 浅克隆，本地 merge-base 拿不到两侧对象。
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          TAG_SHA="$(git rev-parse HEAD)"
          ANCESTRY="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TAG_SHA}...${MAIN_SHA}" --jq .status)"
          if [ "${ANCESTRY}" != "ahead" ] && [ "${ANCESTRY}" != "identical" ]; then
            echo "::error::tag ${TAG_NAME} 的提交 ${TAG_SHA:0:12} 不在 main 历史线（尖端 ${MAIN_SHA:0:12}，compare=${ANCESTRY}）——发布 tag 必须落在 promote 产出的推进线上"
            exit 1
          fi
          META_VERSION="$(python -c \
            "import re;print(re.search(r'(?m)^version: (.+)$', open('metadata.yaml', encoding='utf-8').read()).group(1).strip())")"
          # 版本直接沿用上游（去 v 前缀比对，容忍两侧前缀书写差异）
          if [ "${TAG_NAME#v}" != "${META_VERSION#v}" ]; then
            echo "::error::tag ${TAG_NAME} 与 metadata.yaml version ${META_VERSION} 不一致；版本由两层注入流水线随 roll 再生，tag 必须与其锁步"
            exit 1
          fi

      # 依赖安装统一走复合 action（.github/actions/setup-env），默认档。
      # 与 ci.yml 的 test job 同构：不装 astrbot 时 test_event_stop /
      # test_sender_chain / test_json_card_urls 会 pytest.importorskip 整模块静默
      # 跳过，而它们恰是桥接层的行为契约（H6 同类缺陷在发布轨的残留，2026-09-18
      # 复核）。发布物一旦带着静默降级的测试结果出去，就是「绿着发布了一个没人
      # 验过的桥」。
      - name: 安装依赖（与 ci.yml 的 test job 同构）
        uses: ./.github/actions/setup-env  # zizmor: ignore[self-repository] actionlint 尚不支持 $/

      - name: 确定性测试门禁
        run: |
          set -euo pipefail
          python scripts/verify_vendor.py
          python -m pytest -c config/pyproject.toml --rootdir=. -q

      - name: 构建插件 zip（显式白名单，杜绝发布物混入）
        run: |
          set -euo pipefail
          mkdir -p "dist/astrbot_plugin_parser_lite"
          # 白名单 = main.py 的桥接导入闭包全量（config_sync/vendor_patches/texts/
          # render_params 均为运行时硬依赖，缺一即 ModuleNotFoundError）；
          # 闭包与白名单的一致性由 tests/test_release_manifest.py 机械钉扎
          cp -a metadata.yaml requirements.txt main.py bridge \
                templates vendor _conf_schema.json README.md logo.png \
                dist/astrbot_plugin_parser_lite/
          cd dist
          zip -qr "../astrbot_plugin_parser_lite-${TAG_NAME}.zip" astrbot_plugin_parser_lite
          cd ..
          sha256sum "astrbot_plugin_parser_lite-${TAG_NAME}.zip"

      - name: zip 结构断言（发布侧两层注入守卫）
        run: |
          set -euo pipefail
          python - "$TAG_NAME" <<'PYEOF'
          import sys, zipfile
          zip_path = f"astrbot_plugin_parser_lite-{sys.argv[1]}.zip"
          names = zipfile.ZipFile(zip_path).namelist()
          tops = {n.split("/")[0] for n in names}
          # AstrBot zip_updater 期望 zip 内有且仅有一个顶层目录，其内容移入插件根
          assert tops == {"astrbot_plugin_parser_lite"}, f"顶层目录必须唯一: {sorted(tops)}"
          required = [
              "astrbot_plugin_parser_lite/metadata.yaml",
              "astrbot_plugin_parser_lite/main.py",
              "astrbot_plugin_parser_lite/bridge/sender.py",
              "astrbot_plugin_parser_lite/bridge/render.py",
              "astrbot_plugin_parser_lite/bridge/ssrf.py",
              "astrbot_plugin_parser_lite/bridge/config_sync.py",
              "astrbot_plugin_parser_lite/bridge/vendor_patches.py",
              "astrbot_plugin_parser_lite/bridge/texts.py",
              "astrbot_plugin_parser_lite/bridge/render_params.py",
              "astrbot_plugin_parser_lite/bridge/gen_config.py",
              "astrbot_plugin_parser_lite/_conf_schema.json",
              "astrbot_plugin_parser_lite/vendor/nonebot_plugin_parser_lite/__init__.py",
              "astrbot_plugin_parser_lite/logo.png",
          ]
          missing = [r for r in required if r not in names]
          assert not missing, f"发布物缺关键文件: {missing}"
          print(f"zip 结构 OK（{len(names)} 个条目）")
          PYEOF

      # ---- SBOM：软件物料清单（NTIA / CISA SBOM 最低要素；Scorecard 的 SBOM 项）----
      # 用 Syft（anchore/sbom-action，业界事实标准）扫发布物目录，产出 SPDX JSON。
      # 刻意关掉 upload-artifact / upload-release-assets：release 里有什么，必须
      # 由本文件的显式白名单单独决定（与 zip 的白名单同一原则），不让第三方
      # action 私自增删附件 —— 否则「发布物清单」就有了第二个作者。
      - name: 生成 SPDX SBOM（Syft）
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/astrbot_plugin_parser_lite
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate SLSA provenance attestation
        id: attest_prov
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "astrbot_plugin_parser_lite-*.zip"

      - name: Generate SBOM attestation
        id: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "astrbot_plugin_parser_lite-*.zip"
          sbom-path: sbom.spdx.json

      # ---- 把证明落成 release 附件 -------------------------------------------
      # 为什么必须落盘：actions/attest 默认只把证明写进 GitHub 的 attestation
      # store，而 store 要联网查询、且**不在 release 资产里**。后果有两个：
      #   ① 消费方无法离线验证（官方离线流程要求手上有 bundle 文件）；
      #   ② 供应链扫描器只看 release 资产的**文件名后缀**，看不见 store ——
      #      于是「有证明」被读成「没证明」。
      # 后缀取 .intoto.jsonl：GitHub 官方离线验证文档里 bundle 下载下来的扩展名
      # 就是 .jsonl（内容为单行 JSON，即合法 JSONL），而 SLSA 生态对 provenance
      # bundle 的约定名是 <artifact>.intoto.jsonl。
      # 供应链扫描器（OpenSSF Scorecard 的 Signed-Releases）的判定正是读这个后缀：
      # provenanceExtensions = [".intoto.jsonl"] → 满分；仅有签名类后缀 → 低一档。
      - name: 归档证明 bundle 为 release 附件
        env:
          PROV_BUNDLE: ${{ steps.attest_prov.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest_sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          require_file() {
            if [ -z "$2" ] || [ ! -f "$2" ]; then
              echo "::error::$1 证明 bundle 不存在（${2:-空}）—— attest 步骤未产出可归档文件"
              exit 1
            fi
          }
          require_file provenance "$PROV_BUNDLE"
          require_file sbom "$SBOM_BUNDLE"
          cp "$PROV_BUNDLE" "astrbot_plugin_parser_lite-${TAG_NAME}.zip.intoto.jsonl"
          cp "$SBOM_BUNDLE" "sbom.spdx.json.intoto.jsonl"
          ls -l ./*.intoto.jsonl sbom.spdx.json

      - name: 创建 Release（附 zip、校验和、证明与 SBOM）
        run: |
          set -euo pipefail
          ZIP="astrbot_plugin_parser_lite-${TAG_NAME}.zip"
          sha256sum "$ZIP" > "${ZIP}.sha256"
          # tag push 与 dispatch 双通道 + 重放都收敛到这里：已有 Release 就
          # 止步，绝不覆盖已签名发布物（不可变性在资产面兜底）。
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG_NAME} 已存在——跳过创建（双通道重复触发或重放）"
            exit 0
          fi
          # 预发布标记由版本号机械派生（人不判内容）：PEP440 前奏形态
          # （a/b/rc/dev、alpha/beta/preview，含上游「1.3.7-pre-release.4」
          # 变体）一律 prerelease——台账如实反映版本语义，正式版零误伤。
          release_flags=()
          if printf '%s' "${TAG_NAME#v}" | grep -qE '([0-9]+(a|b|rc)[0-9]+$|\.dev[0-9]*$|(alpha|beta|preview|pre-release|rev))'; then
            release_flags+=(--prerelease)
            echo "::notice::PEP440 前奏版本 → 标记 prerelease"
          fi
          # Release 正文的「上游 release 信息」承接：本次版本区间跨越的
          # 上游 stable release notes 由 scripts/release_advisory.py 渲染
          # （判据与 sync 管线同一实现）逐字写入，并给出上游 releases 入口
          # 供核对正式 tag 与版本号。--generate-notes 不使用——它按本仓库
          # commit diff 组装，同步型仓库里只是噪声。
          notes_file="release-notes.md"
          {
            echo "AstrBot 桥接插件发布：版本承自上游 nonebot-plugin-parser-lite 的 standalone 轨构建快照（当前构建 ${TAG_NAME#v}，与 metadata.yaml 随 roll 再生锁步）。上游正式 release 轨（stable tag 及其版本号）见 https://github.com/sokoko-org/nonebot-plugin-parser-lite/releases ；其 stable 发布节奏慢于本轨，前奏版本以 prerelease 如实标注。"
            echo
          } > "${notes_file}"
          prev_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" -q '[.[]|select(.draft==false)|.tag_name]|map(select(. != env.TAG_NAME))|.[0] // ""' 2>/dev/null || true)"
          if [ -n "${prev_tag}" ]; then
            if advisory="$(python3 scripts/release_advisory.py --old "${prev_tag#v}" --new "${TAG_NAME#v}" 2>/dev/null)"; then
              if [ -n "${advisory}" ]; then
                printf '%s\n\n' "${advisory}" >> "${notes_file}"
              fi
            else
              echo "::warning::上游 release 信息抓取失败，正文略去上游节（不影响发布）"
            fi
          fi
          {
            echo "### 发布物"
            echo ""
            echo "| 资产 | 说明 |"
            echo "|---|---|"
            echo "| \`${ZIP}\` | 插件包 |"
            echo "| \`${ZIP}.sha256\` | 校验和 |"
            echo "| \`${ZIP}.intoto.jsonl\` | SLSA provenance（Sigstore bundle） |"
            echo "| \`sbom.spdx.json\` | SPDX 软件物料清单 |"
            echo "| \`sbom.spdx.json.intoto.jsonl\` | SBOM 证明 |"
            echo ""
            echo "离线验证（先取可信根：\`gh attestation trusted-root > trusted_root.jsonl\`）："
            echo ""
            echo '```bash'
            echo "gh attestation verify ${ZIP} -R ${GITHUB_REPOSITORY} \\"
            echo "  --bundle ${ZIP}.intoto.jsonl \\"
            echo "  --custom-trusted-root trusted_root.jsonl"
            echo '```'
            echo ""
            echo "注：public 仓库的 attestation 由 Sigstore public good instance 签发；"
            echo "private 仓库用的是 GitHub 自己的 Sigstore 实例。"
            echo "\`gh attestation trusted-root\` 一条命令同时取得两者。"
          } >> "${notes_file}"
          gh release create "${TAG_NAME}" --verify-tag --notes-file "${notes_file}" \
            "${release_flags[@]}" \
            "$ZIP" \
            "${ZIP}.sha256" \
            "${ZIP}.intoto.jsonl" \
            "sbom.spdx.json" \
            "sbom.spdx.json.intoto.jsonl"
