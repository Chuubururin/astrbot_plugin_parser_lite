name: promote-dev-to-main

# 把 dev 的尖端**移动**到 main —— main 是纯粹的发布指针，永远与 dev 是同一个提交。
#
# ── 模型说明（参考 SnowLuma/SnowLuma 的 promote-dev-to-main.yml）────────
# main 不是「合并」出来的，而是被**指**过去的：
#   git push --force-with-lease origin origin/dev:refs/heads/main
# 这样做的收益：
#   1. 不产生 merge commit —— GitHub 的 network graph 不会出现 dev/main 来回交叉
#   2. main 的历史 = dev 的历史，逐字节相等，不存在「main 上有 dev 没验证过的东西」
#   3. 回滚时对比简单：main 与 dev 只可能是同一个或不同一个 sha
#
# ── 与「PR 合并」的对比：一条硬约束必须记住 ──────────────────────────────
# 本模型要求 main **不能**开启分支保护的
# "Require a pull request before merging"（API 字段 required_pull_request_reviews），
# 因为那会拒绝**所有**直接推送 —— 包括本工作流自己的推送，Promote 会直接失效。
# 这与常规最佳实践相反，是有意的取舍。详见 doc/BRANCHING.md。
#
# ── 强制力来自哪里 ──────────────────────────────────────────────────────
# 仓库为 public，分支保护真实可用：
#   main 上 enforce_admins=true → **任何人（含管理员）都不能直推 main**
# 所以「只有本工作流能改 main」是**服务端强制**，不是工作流约定。
#
# ── 为什么用 GITHUB_TOKEN ────────────────────────────────────────────────
# 零配置即可用。代价如实声明：GITHUB_TOKEN 推的提交**不会**触发后续工作流，
# 所以 main 移动之后不会出现新的 CI 运行 —— 这是刻意的，dev 上的 CI 已经跑过，
# main 与 dev 是同一个提交，再跑一遍纯属冗余。

on:
  push:
    branches: [dev]
    tags: ['chore.*'] # chore.* tag 是与代码提交解耦的 promote 开关
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false # 提权不打断在途提权（半个 main 比没 main 糟）

jobs:
  decide:
    name: decide whether to promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: 判定是否应当 promote
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          run='false'
          reason=''

          case "${EVENT_NAME}" in
            workflow_dispatch)
              run='true'
              reason='手动触发（workflow_dispatch）'
              ;;
            push)
              if [ "${REF_TYPE}" = 'tag' ]; then
                run='true'
                reason="chore.* tag：${REF}"
              elif [ "${REF}" = 'refs/heads/dev' ]; then
                # 前缀匹配（不是任意位置）：'[merge] fix: xxx' 触发，
                # 'fix: xxx [merge]' 不触发。开发人员不得使用这两个前缀，
                # 否则会意外触发发布 —— 这条写进 CONTRIBUTING 并有契约测试钉住。
                first_line="$(printf '%s' "${HEAD_MSG:-}" | head -1)"
                if printf '%s' "$first_line" | grep -qiE '^\[merge\]|^chore\(release\):'; then
                  run='true'
                  reason="dev 提交信息以保留前缀开头：${first_line}"
                else
                  reason='dev 上的普通提交（无 [merge] / chore(release): 前缀），main 不动'
                fi
              else
                reason="未处理的 ref：${REF}"
              fi
              ;;
            *)
              reason="未处理的事件：${EVENT_NAME}"
              ;;
          esac

          {
            echo "run=${run}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### promote 判定"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 事件 | \`${EVENT_NAME}\` |"
            echo "| ref | \`${REF}\` |"
            echo "| 是否 promote | \`${run}\` |"
            echo "| 依据 | ${reason} |"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  promote:
    name: promote dev → main
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 唯一向 main 写的通道；zizmor 要求 job 级显式声明
      actions: write # tag push 不触发 release（2026-09-25 实测），dispatch 是唯一续链口
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 需要全历史：git cherry 要跨 dev/main 取对象
          ref: dev
          persist-credentials: false # 凭据在下面的校验步骤内显式注入（zizmor artipacked）

      - name: 移动 main 指针到 dev
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.decide.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # 凭据经 env 注入而非直接写进 run: 块 —— 表达式直接展开进 shell
          # 会被 zizmor 判为模板注入（template-injection, High）。
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --quiet origin dev main
          dev_sha="$(git rev-parse origin/dev)"
          main_sha="$(git rev-parse origin/main)"
          dev_short="$(git rev-parse --short origin/dev)"
          main_short="$(git rev-parse --short origin/main)"

          if [ "$dev_sha" = "$main_sha" ]; then
            echo "::notice::main 已等于 dev（${dev_short}），无需 promote"
            {
              echo "main 已等于 dev @ \`${dev_short}\`，无需 promote。"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi

          # main 上若有 dev 没有的提交 → 本模型下**必须失败**。
          # 若静默改用 merge，就会造出一个 dev 从未验证过的合并提交进入发布线，
          # 而「main 上的每个提交都逐字节等于某个已过 CI 的 dev 提交」是这套
          # 分支模型唯一的正确性保证。破坏它，整个模型就失去意义。
          unique="$(git cherry origin/dev origin/main | awk '/^\+/ { print $2 }' || true)"
          if [ -n "$unique" ]; then
            echo "::error::main 存在 dev 之外的提交，无法快进。请先把这些提交收回 dev。"
            echo "main 独有的提交："
            # 不用未加引号的命令替换（actionlint 的 shellcheck 会判 SC2046），
            # 用 while read 逐行消费。
            printf '%s\n' "$unique" | while read -r sha; do
              [ -n "$sha" ] && git log --oneline -1 "$sha"
            done || true
            exit 1
          fi

          # --force-with-lease 钉住「我校验过的那个 main」：
          # 若有人在校验与推送之间动了 main，推送被拒而不是抹掉对方的提交。
          #
          # 注：快进语义下这不构成 force push（远端 sha 是新提交的祖先），
          # 因此不受 allow_force_pushes=false 阻断 —— 本模型选指针移动而非
          # merge 的原因之一，也是 doc/BRANCHING.md 里记的「已实测」项之一。
          git push --force-with-lease="refs/heads/main:${main_sha}" \
            origin "origin/dev:refs/heads/main"

          echo "::notice::main ${main_short} → dev@${dev_short}"
          {
            echo "### promote 完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| \`main\` 原值 | \`${main_sha}\` |"
            echo "| \`main\` 现值 | \`dev\` @ \`${dev_sha}\` |"
            echo "| 依据 | ${REASON} |"
            echo "| 运行 | ${RUN_URL} |"
            echo ""
            echo "发版 tag 由下一步「自动打发布 tag」处理，无需人工。"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # 发布 tag 是 promote 的机械推论：metadata.yaml 的版本唯一来自上游，
      # 「main 尖端版本 ≠ 已发布 tag」= 有一个已验证但未发布的版本。
      # 人工打 tag 会把同一个判断做第二遍，忘了就造成「main 绿着但用户
      # 拿不到」的静默漂移。
      # tag push 之后必须显式 dispatch release.yml：2026-09-25 实测
      # GITHUB_TOKEN 的 tag push **不触发** release（防循环规则覆盖 push 事件），
      # dispatch 是发布轨唯一的确定性入口。若哪天 tag push 也触发了，release 的
      # concurrency 与「已存在则跳过」双保险消化重复。
      # 已存在同名 tag 且指 main 尖端时**也派发**：覆盖「tag 成功、dispatch 失败」
      # 的中间态——不补发就永久停摆（release.yml 侧幂等，重复派发无副作用）。
      - name: 自动打发布 tag（版本 ≠ 已发布 tag → main 尖端）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse origin/main)"
          version="$(git show "${main_sha}:metadata.yaml" \
            | python3 -c "import re,sys; print(re.search(r'(?m)^version: (.+)$', sys.stdin.read()).group(1).strip())")"
          tag="v${version#v}"
          remote_tag_sha="$(git ls-remote origin "refs/tags/${tag}" | head -1 | cut -f1)"
          if [ -n "${remote_tag_sha}" ]; then
            if [ "${remote_tag_sha}" = "${main_sha}" ]; then
              echo "::notice::${tag} 已在 main 尖端，补发 release（幂等）"
              gh workflow run release.yml --ref dev -f tag_name="${tag}"
            elif gh release view "${tag}" >/dev/null 2>&1; then
              echo "::notice::${tag} 已在不可变锚上发布过 Release，不重发"
            else
              echo "::warning::${tag} 不在 main 尖端且 Release 缺失（tag 成功/dispatch 失败的中间态）——补发，release 侧按 main 历史线校验"
              gh workflow run release.yml --ref dev -f tag_name="${tag}"
            fi
            exit 0
          fi
          git tag "${tag}" "${main_sha}"
          git push origin "${tag}"
          gh workflow run release.yml --ref dev -f tag_name="${tag}"
          echo "::notice::自动打 ${tag} @ ${main_sha:0:12} 并已派发 release 工作流"

      - name: 汇总
        if: ${{ always() }}
        env:
          REASON: ${{ needs.decide.outputs.reason }}
        run: |
          {
            echo ""
            echo "触发依据：${REASON}"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
