name: CodeQL

# 静态应用安全测试（SAST）。
#
# 为什么这个工作流在旧仓库里不存在：CodeQL 需要 GitHub Advanced Security，
# 而旧仓库是 **private + Free**（GHAS 不可用）。仓库转为 **public** 后，
# code scanning 对 public 仓库**免费开放**，于是这条空白被填上：
#   > Code scanning is available for: Public repositories on GitHub.com
#   > If you want to use code scanning on private repositories, you need a
#   > GitHub Code Security license.
#   > —— https://docs.github.com/en/code-security/concepts/code-scanning/code-scanning
#
# 供应链扫描器（OpenSSF Scorecard 的 SAST 项）只认 github/codeql-action 或
# SonarCloud —— 用第三方 SAST 工具反而拿不到这一项的分。故此处用官方 action。
#
# 分支模型见 CONTRIBUTING.md：dev 是工作分支，main 是发布指针。
# main 不单独扫：main 的每个提交都逐字节等于 dev 上某个已扫过的提交
# （fast-forward 提权，见 promote-dev-to-main.yml），重复扫是浪费。
on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    # 每周一 UTC 04:23（北京 12:23）。刻意避开 sync-upstream 的 17:17 与
    # protection-audit 的 05:41，避免同一时刻的资源争抢。
    # 定期全量扫描的价值：新发布的 CodeQL 查询包会命中旧代码里的老问题，
    # 只靠 push/pull_request 触发会永远漏掉这类「查询更新带来的发现」。
    - cron: "23 4 * * 1"

# Scorecard Token-Permissions：顶层只读，写权限在 job 级显式声明。
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # 这个 job 名会出现在 main 的 required status checks 里，改名等于改外部契约
    # （分支保护上的 context 会失配 → PR 永久卡住）。改名时必须同步更新
    # scripts/apply_branch_protection.sh 与 docs/BRANCHING.md。
    name: analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # CodeQL 的三项权限，缺一即红。zizmor 的 undocumented-permissions 要求
      # **权限行本身带注释**（上方的整段说明不算，它只看紧邻该行的注释）。
      security-events: write # 上传 SARIF 分析结果到 code scanning（必需）
      actions: read # 读 workflow 元数据做 Actions 分析（最易漏的一项）
      contents: read # 读仓库代码
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # zizmor artipacked

      - name: Initialize CodeQL
        # v3.38.1 的 tag 解引用后即 3ea06614...（v3 浮动 tag 当前也指向它）。
        # 钉 commit sha 而非 v3：只有 commit sha 是不可变形式
        # （GitHub Secure use 指南），浮动 tag 可被上游改写。
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: python
          # security-and-quality 比默认 security 多一组代码质量查询（不可达代码、
          # 冗余比较、错误的异常处理等）。本仓库有大量协议/URL 解析逻辑
          # （bridge/ssrf.py、vendor 的解析器），质量类查询能更早发现问题。
          # 代价是告警量上升 —— 若噪声压过真信号，删掉这一行即回到默认档。
          queries: security-and-quality
          # vendor/ 与 templates/ 是上游快照（零修改铁律：只能整树重建，
          # 不许就地改），doc/ 是设计文档 —— 对它们报出的问题我们改不了，
          # 只会淹没真问题。
          # 注意：paths-ignore 只在 init 的 config 里生效，与 analyze 步骤无关；
          # 改这里就够了，别在两处各写一份。
          config: |
            paths-ignore:
              - vendor
              - templates
              - doc

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          category: "/language:python"
