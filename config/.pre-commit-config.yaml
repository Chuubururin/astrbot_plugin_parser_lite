# Pre-commit 护栏：格式化/静态检查 + workflow 审计 + force-push 防护
# 运行 `pre-commit install --install-hooks` 后对每次提交生效；
# mypy/pytest 不在提交钩子里（保持提交轻快），由 CI 与 implement 流程按需运行。
# 顶层 exclude：vendor/ 与 .sync-work/ 是上游快照（零修改铁律），
# templates/ 是上游 main render/templates 快照（逐字节对齐），
# 一律排除在改写类钩子之外（repo 级 exclude 不是合法键，勿下沉）。
# 分支模型见 CONTRIBUTING.md 第 8 节：dev 是工作分支、main 是发布指针。
exclude: ^vendor/|^\.sync-work/|^templates/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix, --config, config/pyproject.toml]
      - id: ruff-format
        args: [--config, config/pyproject.toml]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--pedantic]

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint (system binary; rhysd hook 需 go 编译，离线环境装不了)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: no-force-push-main
        name: block non-fast-forward (forced) push to main/dev
        entry: bash scripts/no-force-push-main.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
